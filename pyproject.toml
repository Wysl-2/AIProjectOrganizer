[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-organizer"
version = "0.1.0"
description = "A project-oriented organizer for AI-assisted software development."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials",
]

[project.scripts]
ai-project-organizer = "ai_project_organizer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_project_organizer = ["resources/icons/*.svg"]